name: Build Runner

on:
  workflow_call:

jobs:
  build-runner:
    runs-on: ubuntu-latest
    permissions:
      contents: read
    concurrency:
      group: ${{ github.workflow }}-${{ github.head_ref || github.run_id }}
      cancel-in-progress: true

    outputs:
      changed: ${{ steps.diff.outputs.changed }}

    steps:
      - name: Checkout code
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          # The PR head, not the default merge commit, so the generated files
          # can be pushed back to the PR branch as a fast-forward.
          ref: ${{ github.event.pull_request.head.sha || github.sha }}
          # Keep the token away from the PR-controlled build steps below.
          persist-credentials: false

      - name: Setup Flutter
        uses: subosito/flutter-action@1a449444c387b1966244ae4d4f8c696479add0b2 # v2.23.0
        with:
          channel: "stable"
          cache: true

      - name: Get dependencies
        run: flutter pub get

      - name: Run build_runner
        run: dart run build_runner build

      - name: Diff generated files
        id: diff
        # No write-capable token here: this job runs PR-controlled code, so it
        # only produces a patch for the trusted job below to apply and push.
        run: |
          git add -A
          git diff --cached --binary > "$RUNNER_TEMP/generated.patch"
          if [ -s "$RUNNER_TEMP/generated.patch" ]; then
            echo "changed=true" >> $GITHUB_OUTPUT
          else
            echo "changed=false" >> $GITHUB_OUTPUT
          fi

      - name: Upload generated patch
        if: steps.diff.outputs.changed == 'true'
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: generated-patch
          path: ${{ runner.temp }}/generated.patch

  push-generated:
    needs: build-runner
    runs-on: ubuntu-latest
    permissions:
      contents: write
    if: needs.build-runner.outputs.changed == 'true' && github.event_name == 'pull_request' && github.event.pull_request.head.repo.full_name == github.repository
    steps:
      - name: Checkout code
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ github.event.pull_request.head.sha }}

      - name: Download generated patch
        uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8.0.1
        with:
          name: generated-patch
          path: ${{ runner.temp }}

      - name: Commit and push generated files
        # This job never runs PR-controlled code, so the token is safe here.
        env:
          HEAD_REF: ${{ github.head_ref }}
        run: |
          git config --local user.email "action@github.com"
          git config --local user.name "GitHub Action"
          git apply --index "$RUNNER_TEMP/generated.patch"
          git commit -m "chore: regenerate build_runner output"
          git push origin "HEAD:$HEAD_REF"
